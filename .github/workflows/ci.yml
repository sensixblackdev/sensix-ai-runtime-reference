name: runtime-reference-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docker/gateway/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker compose -f docker/compose.pod-h100.yml config >/dev/null
        env:
          SENSIX_GATEWAY_API_KEY: ci-only-placeholder

  publish-gateway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/gateway
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenAI-compatible routing gateway for self-hosted GPU inference.
          tags: |
            ghcr.io/${{ github.repository_owner }}/sensix-ai-runtime-gateway:latest
            ghcr.io/${{ github.repository_owner }}/sensix-ai-runtime-gateway:${{ github.sha }}
